services:
  echovault-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echovault-backend
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage
      - ./backend/data:/app/data
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_URL: ${DB_URL:-jdbc:mysql://echovault-mysql:3306/echovault?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-echovault}
      DB_PASSWORD: ${DB_PASSWORD:-}
    restart: unless-stopped

  echovault-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echovault-frontend
    ports:
      - "5173:80"
    depends_on:
      - echovault-backend
    restart: unless-stopped

  echovault-mysql:
    image: mysql:8.0
    container_name: echovault-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting the MySQL profile}
      MYSQL_DATABASE: echovault
      MYSQL_USER: ${DB_USERNAME:-echovault}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the MySQL profile}
    volumes:
      - mysql-data:/var/lib/mysql
    profiles:
      - mysql
    restart: unless-stopped

volumes:
  mysql-data:
