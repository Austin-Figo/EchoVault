spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/echovault?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:echovault}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

echovault:
  storage:
    base-path: ../storage
  threshold:
    required-shares: 3
    total-shares: 5
