server:
  port: 8080

spring:
  application:
    name: echovault-backend

  datasource:
    url: jdbc:h2:file:./data/echovault;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB

echovault:
  storage:
    base-path: ../storage
  threshold:
    required-shares: 3
    total-shares: 5
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"

management:
  endpoints:
    web:
      exposure:
        include: health,info
